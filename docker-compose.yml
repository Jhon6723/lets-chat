services:
  postgres:
    image: postgres:17-alpine
    container_name: lets-chat-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lets_chat -d lets_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
